name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build release app
        run: ./scripts/build-app.sh
      - name: Verify app bundle
        run: codesign --verify --deep --strict dist/GrokBot.app
